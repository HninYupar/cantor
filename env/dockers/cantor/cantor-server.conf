cantor {
  grpc.port = 7443
  storage.type = h2
  storage.type = ${?CANTOR_STORAGE_TYPE}

  h2 = [
    {
      path=./cantor-h2.db
      in-memory=false
      compressed=false
      username=root
      password=""
    }
  ]

  mysql = [
    {
      hostname=host.docker.internal
      port=3306
      username=root
      password=""
    }
  ]

  s3 = {
    bucket=bucket-place-holder
    bucket=${?CANTOR_S3_BUCKET}
    region=us-west-2
    sets.type=h2
    select.type=s3
    select.type=${?CANTOR_S3_SELECT_TYPE}
  }
}
